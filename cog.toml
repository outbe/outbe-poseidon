tag_prefix = "v"
branch_whitelist = ["main"]
ignore_merge_commits = true
generate_mono_repository_global_tag = false

# Rewrite the package's `version` line in Cargo.toml before cog creates
# its `chore(version): vX.Y.Z` commit.
# The sed range `0,/RE/` matches only the first `^version` line.
# By Cargo.toml convention, this line sets `[package].version`.
# Dependency versions use nested `{ version = "..." }` tables and do not start at column 0.
# The pattern `^version.*` matches any column alignment.
#
# outbe-poseidon contains one package and has no `[workspace.package]`.
# The replacement targets `[package].version` and preserves the `version = "..."` format without alignment padding.
#
# Without this hook, cog would tag the release while Cargo.toml metadata would report the old version.
# Any CLI output from CARGO_PKG_VERSION would also report the old version.
# The tag and the version that the artifact reports would differ.
pre_bump_hooks = [
    "sed -i '0,/^version/{s/^version.*/version = \"{{version}}\"/}' Cargo.toml",
    # The repository tracks Cargo.lock.
    # Update its root package version so `cargo package --locked` in release.yml can resolve dependencies.
    "sed -i '/^name = \"outbe-poseidon\"$/{n;s/^version = \".*\"/version = \"{{version}}\"/;}' Cargo.lock",
]

# This configuration has no `post_bump_hooks`.
# The bump job in release.yml pushes the commit and the v* tag after cog returns.
# A local `cog bump` must not push a tag without a GitHub Release or a crates.io publication.
# Create releases from Actions → release → Run workflow.

[changelog]
path = "CHANGELOG.md"
authors = []
