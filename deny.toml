# cargo-deny configuration.
#
# CI checks dependencies for every pull request and each night at 04:00 UTC.
# The crate has few dependencies, all from crates.io.
# These rules prohibit:
#   - Unknown registries.
#   - Git dependencies.
#   - Duplicate versions.
#   - Wildcard requirements.
#
# If a check fails, prefer a fix in the dependency's source project:
#   - For `multiple-versions`, upgrade the dependency that requires the older version.
#     Alternatively, add `[patch.crates-io]` until the source project provides a fix.
#     Use `[bans.skip]` only if the source project blocks a fix.
#     Include the reason for the exception.
#   - For an advisory, upgrade the affected crate.
#     An `[advisories.ignore]` entry must include the RUSTSEC ID and a written reason.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # ark-ff 0.5.0 depends on `paste` indirectly.
    # Keep this exception until ark-ff and ark-bn254 can use version 0.6.x.
    # Version 0.6.x removes the dependency on `paste`.
    { id = "RUSTSEC-2024-0436", reason = "Transitive via ark-ff 0.5.0; blocked on arkworks 0.6 migration." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # `unicode-ident` currently uses the `Unicode-3.0` license.
    # Every proc-macro crate depends on `unicode-ident` indirectly.
    # Earlier versions used `Unicode-DFS-2016`.
    # Allow both licenses to support old and new releases of indirect ark-* and proc-macro dependencies.
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
