name: cargo-deny

# This nightly advisory scan runs separately from the pull request checks.
# GitHub can disable this scheduled workflow after inactivity or 14 consecutive failures.
# Pull request checks can still run if GitHub disables this workflow.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
