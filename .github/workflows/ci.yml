name: CI

# Triggers
#   push:main         lint/test/build + cog auto-bump. The bump job pushes the
#                     `v*` tag with RELEASE_TOKEN so this workflow re-runs on
#                     the tag (the default GITHUB_TOKEN cannot start that run).
#   push:tags:["v*"]  release-only path; skip lint/test/build, publish to
#                     crates.io, cut the signed GitHub Release
#   pull_request      lint/test/build/cargo-deny + version preview
#   schedule          nightly cargo-deny at 04:00 UTC to surface fresh advisories
#   workflow_dispatch maintainer-named (re-)release; empty `tag` input runs the
#                     normal main pipeline
#
# Secrets (see SECURITY.md):
#   RELEASE_TOKEN          PAT that can push to main (bypass ruleset) and whose
#                          tag push is allowed to start workflows
#   CARGO_REGISTRY_TOKEN   crates.io API token (publish-new + publish-update)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing tag to (re-)release (e.g. "v0.2.0"). Empty input
          runs the normal main pipeline.
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ----------------------------------------------------------------
  # Mode prelude. Every release-aware job's `if:` reads `release_tag`.
  # Non-empty when this run is a release-only path (tag push or
  # workflow_dispatch with `tag` input). Empty otherwise — the
  # normal "ran on main" / "PR" pipeline.
  # ----------------------------------------------------------------
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.r.outputs.release_tag }}
    steps:
      - id: r
        run: |
          set -euo pipefail
          tag=""
          case "${{ github.event_name }}" in
            push)
              if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
                tag="${{ github.ref_name }}"
              fi
              ;;
            workflow_dispatch)
              tag='${{ inputs.tag }}'
              ;;
          esac
          echo "release_tag=${tag}"
          echo "release_tag=${tag}" >> "$GITHUB_OUTPUT"

  # Supply-chain enforcement. Runs on every PR + nightly cron @ 04:00 UTC.
  # Independent of the rest of the pipeline so a fresh advisory surfacing
  # nightly is visible without rerunning lint/test.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  commitlint:
    name: Commit lint (conventional-commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    needs: [resolve]
    if: needs.resolve.outputs.release_tag == ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy, cargo
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-stable-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-lint-

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (code smells check)
        run: |
          cargo clippy --version
          # Run clippy with practical code smell checks
          # Focus on catching critical issues: debug macros, unsafe patterns, etc.
          cargo clippy --all-targets --all-features -- -D warnings \
            -D clippy::dbg_macro \
            -D clippy::print_stdout \
            -D clippy::print_stderr \
            -D clippy::todo \
            -D clippy::unimplemented \
            -D clippy::panic \
            -D clippy::exit \
            -D clippy::cast_lossless \
            -D clippy::cast_possible_truncation \
            -D clippy::cast_possible_wrap \
            -D clippy::cast_precision_loss \
            -D clippy::cast_sign_loss \
            -D clippy::clone_on_ref_ptr \
            -D clippy::empty_enums \
            -D clippy::enum_glob_use \
            -D clippy::if_not_else \
            -D clippy::mut_mut \
            -D clippy::non_ascii_literal \
            -D clippy::single_match_else \
            -D clippy::string_add \
            -D clippy::string_add_assign \
            -D clippy::string_lit_as_bytes \
            -D clippy::unnecessary_unwrap \
            -D clippy::unused_self \
            -D clippy::useless_let_if_seq \
            -A clippy::module_name_repetitions \
            -A clippy::must_use_candidate \
            -A clippy::missing_errors_doc \
            -A clippy::missing_panics_doc \
            -A clippy::too_many_lines \
            -A clippy::similar_names \
            -A clippy::inline_always \
            -A clippy::unwrap_used \
            -A clippy::expect_used \
            -A clippy::panic \
            -A unused_imports \
            -A unused_macros \
            -A dead_code

      - name: Check documentation builds
        run: cargo doc --no-deps --all-features --document-private-items

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [resolve, lint]
    if: needs.resolve.outputs.release_tag == ''
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
        include:
          - rust: nightly
            allow_failure: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy, cargo
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: ${{ matrix.rust == 'nightly' }}

      - name: Run clippy
        run: |
          cargo clippy --version
          cargo clippy --all-targets --all-features -- -D warnings \
            -D clippy::dbg_macro \
            -D clippy::print_stdout \
            -D clippy::print_stderr \
            -A clippy::unwrap_used \
            -A clippy::expect_used \
            -A clippy::panic
        continue-on-error: ${{ matrix.rust == 'nightly' }}

      - name: Run tests
        run: cargo test --verbose --all-features

      - name: Build
        run: cargo build --verbose --release --all-features

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: [resolve, lint, test]
    if: needs.resolve.outputs.release_tag == ''
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy, cargo
          toolchain: ${{ matrix.rust }}
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-
      - name: Build
        run: cargo build --verbose --release --all-features

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: target/release/
          if-no-files-found: ignore

  # ----------------------------------------------------------------
  # Versioning (cocogitto). See cog.toml.
  #
  # Pull requests only: report the version a merge would cut, tagging
  # nothing. The history predates Conventional Commits, so the check
  # covers the range the pull request introduces rather than the
  # whole log. Mirrors outbe-circuits.
  # ----------------------------------------------------------------
  preview-version:
    name: preview next version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: taiki-e/install-action@v2
        with:
          tool: cocogitto

      - name: Validate the commits this pull request adds
        run: >-
          cog check --ignore-merge-commits
          "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Preview the bump
        shell: bash
        run: |
          set -euo pipefail
          # Neutralise cog.toml's branch_whitelist for this read-only
          # preview so it runs from a pull-request ref. Nothing is
          # committed or tagged.
          cfg="$(mktemp -d)/cog.toml"
          sed 's/^branch_whitelist.*/branch_whitelist = []/' cog.toml > "$cfg"
          if out="$(cog --config "$cfg" bump --auto --dry-run --skip-untracked 2>/dev/null)"; then
            tag="$(printf '%s\n' "$out" | grep -Eo 'v?[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*' | tail -n1 || true)"
            echo "::notice::next release would be: ${tag:-<no bump warranted>}"
          else
            echo "::notice::no bump warranted"
          fi

  # ----------------------------------------------------------------
  # main only, once every gate is green: cut the next v* tag, then
  # push the bump commit and the tag through cog.toml's post-bump
  # hooks. The push uses RELEASE_TOKEN so the owner bypasses the
  # branch ruleset; that also lets the tag push start this workflow's
  # release path, which the default GITHUB_TOKEN cannot do.
  # Mirrors outbe-circuits.
  # ----------------------------------------------------------------
  bump:
    name: bump version & tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [resolve, cargo-deny, lint, test, build]
    if: |
      needs.resolve.outputs.release_tag == '' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(version):') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Require RELEASE_TOKEN
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo "::error::RELEASE_TOKEN is not set. See SECURITY.md (CI secrets)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cocogitto

      - name: Configure the committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate the new commit
        run: cog check --ignore-merge-commits "HEAD^..HEAD"

      - name: Cocogitto bump
        shell: bash
        run: |
          set -euo pipefail
          # cog does not see the CI checkout as `main`, so its own
          # branch_whitelist guard would reject the bump. The job `if:`
          # above is what restricts this to a push on main. Every hook
          # from cog.toml is preserved and runs with the checkout
          # credentials (RELEASE_TOKEN).
          cfg="$(mktemp -d)/cog.toml"
          sed 's/^branch_whitelist.*/branch_whitelist = []/' cog.toml > "$cfg"
          cog --config "$cfg" bump --auto
          tag="$(git tag --points-at HEAD | grep '^v' | head -n1 || true)"
          if [ -n "$tag" ]; then
            echo "::notice::cut ${tag}; the tag push starts the publish + github-release jobs"
          else
            echo "::notice::no bump warranted"
          fi

  # ----------------------------------------------------------------
  # Publish (tag-push / workflow_dispatch). Fires when resolve has a
  # release_tag: a `v*` tag landing (normally from the bump job) or a
  # maintainer-named re-release. The bump run itself does not publish
  # — that would double-fire once RELEASE_TOKEN's tag push starts this
  # workflow again.
  # ----------------------------------------------------------------
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [resolve]
    if: needs.resolve.outputs.release_tag != ''
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the named tag so cargo publish ships the bumped
          # Cargo.toml the bump job's cog run wrote, not a stale SHA.
          ref: ${{ needs.resolve.outputs.release_tag }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: cargo

      - name: The tag and the manifest agree
        env:
          TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ "v${manifest}" != "$TAG" ]; then
            echo "::error::tag ${TAG} but Cargo.toml says ${manifest}; cog's pre-bump hook did not run"
            exit 1
          fi
          echo "::notice::${TAG} matches the package manifest"

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set. See SECURITY.md (CI secrets)."
            exit 1
          fi
          version="${TAG#v}"
          # Re-cutting a GitHub Release for an already-published version
          # must not fail the rest of the pipeline on crates.io's
          # "already uploaded" error. crates.io requires a User-Agent.
          status="$(curl -sS -o /tmp/crate.json -w '%{http_code}' \
            -A 'outbe-poseidon-ci (https://github.com/outbe/outbe-poseidon)' \
            "https://crates.io/api/v1/crates/outbe-poseidon/${version}")"
          case "$status" in
            200)
              echo "::notice::outbe-poseidon@${version} already on crates.io; skipping publish"
              ;;
            404)
              cargo publish --verbose --token "${CARGO_REGISTRY_TOKEN}"
              ;;
            *)
              echo "::error::crates.io lookup failed (HTTP ${status})"
              cat /tmp/crate.json || true
              exit 1
              ;;
          esac

      # Re-create the .crate locally. `cargo publish` cleans up
      # target/package/*.crate after a successful upload; `cargo
      # package --no-verify` is fast (skips the re-build) and
      # deterministic given the same source tree, so the resulting
      # bytes match what crates.io just received (or would receive).
      - name: Re-package .crate for artifact upload
        if: success()
        run: cargo package --no-verify

      # Upload the byte-identical `.crate` as a workflow artifact so
      # the `github-release` job can attach it to the GH Release
      # alongside the crates.io copy. Signing produces one sigstore
      # signature that verifies both.
      - name: Upload .crate as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: crate-tarball
          path: target/package/*.crate
          if-no-files-found: error
          retention-days: 1

  # ----------------------------------------------------------------
  # GitHub release. Attaches the byte-identical `.crate` (from the
  # `publish` job's workflow artifact) and a SHA256SUMS file
  # alongside the auto-generated notes. crates.io is the canonical
  # install channel; the GH Release is the signed distribution point.
  # ----------------------------------------------------------------
  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [resolve, publish]
    if: needs.resolve.outputs.release_tag != '' && needs.publish.result == 'success'
    # id-token + attestations widen this job's scope so cosign keyless +
    # actions/attest-build-provenance can mint an OIDC token and write to
    # the GitHub attestation store. Workflow-level perms stay narrower.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}

      - name: Download .crate artifact
        uses: actions/download-artifact@v4
        with:
          name: crate-tarball
          path: dist/

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 *.crate > SHA256SUMS
          echo "---"
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # pin-target: v3

      # Keyless OIDC sign-blob over every staged artifact (.crate +
      # SHA256SUMS). Each gets a sibling `.sig` + `.pem` (the Fulcio-
      # issued ephemeral cert). Skips files that are themselves a sig
      # or cert so a re-run is idempotent.
      - name: Sign release artifacts (cosign keyless)
        run: |
          set -euo pipefail
          cd dist
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in *.sig|*.pem) continue ;; esac
            echo "Signing $f"
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done
          ls -la

      # SLSA v1.0 build provenance for the .crate + SHA256SUMS. Stored
      # in the GitHub attestation store (queryable via `gh attestation
      # verify`); the local DSSE bundle is also captured for users who
      # want offline verification via `cosign verify-blob-attestation`.
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # pin-target: v2
        with:
          subject-path: |
            dist/*.crate
            dist/SHA256SUMS

      - name: Compose release body
        env:
          TAG: ${{ needs.resolve.outputs.release_tag }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          {
            echo "## Install"
            echo
            echo "    cargo add outbe-poseidon@${TAG#v}"
            echo
            echo "## Artifacts"
            echo
            echo "- \`outbe-poseidon-${TAG#v}.crate\` — byte-identical to the crates.io upload."
            echo "- \`SHA256SUMS\` — SHA-256 of the .crate."
            echo "- \`*.sig\` + \`*.pem\` — sigstore cosign keyless signature + Fulcio cert per artifact."
            echo
            echo "## Verification"
            echo
            echo "See [SECURITY.md](https://github.com/outbe/outbe-poseidon/blob/main/SECURITY.md) for the verify recipe."
            echo
            echo "## CI"
            echo
            echo "- crates.io publish: ${PUBLISH_RESULT}"
          } > RELEASE_BODY.md
          cat RELEASE_BODY.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          name: ${{ needs.resolve.outputs.release_tag }}
          body_path: RELEASE_BODY.md
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/*.crate
            dist/*.sig
            dist/*.pem
            dist/SHA256SUMS

  # ----------------------------------------------------------------
  # verify-release: post-publish smoke test. Re-downloads every asset
  # of the release we just cut and runs `cosign verify-blob` against
  # each one. Hard-fails the workflow on any bad signature — this is
  # the regression test for both the action SHA pins and the cert-
  # identity regex below. A typo in the regex silently accepts any
  # sigstore-signed blob, so iterate carefully when porting to other
  # repos.
  # ----------------------------------------------------------------
  verify-release:
    name: Verify signed release
    runs-on: ubuntu-latest
    needs: [resolve, publish, github-release]
    if: |
      needs.resolve.outputs.release_tag != '' &&
      needs.publish.result == 'success' &&
      needs.github-release.result == 'success'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # pin-target: v3

      - name: Download release assets
        env:
          TAG: ${{ needs.resolve.outputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p verify
          gh release download "$TAG" --dir verify --repo "${{ github.repository }}"
          ls -la verify/

      - name: Verify cosign signatures
        env:
          TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          cd verify
          # Identity regex pins the signature to a tag-triggered run of
          # THIS repo's ci.yml workflow. A signature minted on any other
          # workflow path, on a branch ref, or by another repo fails.
          IDENTITY_RE='^https://github\.com/outbe/outbe-poseidon/\.github/workflows/ci\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+)$'
          OIDC_ISSUER='https://token.actions.githubusercontent.com'
          failed=0
          shopt -s nullglob
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in *.sig|*.pem) continue ;; esac
            if [ ! -f "${f}.sig" ] || [ ! -f "${f}.pem" ]; then
              echo "::error::missing ${f}.sig or ${f}.pem alongside ${f}"
              failed=1
              continue
            fi
            echo "Verifying $f"
            if cosign verify-blob \
                --certificate "${f}.pem" \
                --signature "${f}.sig" \
                --certificate-identity-regexp "$IDENTITY_RE" \
                --certificate-oidc-issuer "$OIDC_ISSUER" \
                "$f"; then
              echo "  OK $f"
            else
              echo "::error::cosign verify-blob FAILED for $f"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::one or more release artifacts failed signature verification"
            exit 1
          fi
          echo "All artifacts verified."
