name: release

# Runs when a `v*` tag lands. In the normal path that tag comes from
# ci.yml's `bump` job, which pushes it with RELEASE_TOKEN so this
# workflow can start (the default GITHUB_TOKEN cannot). A tag pushed
# by hand, or a maintainer-named re-release via workflow_dispatch,
# works the same way.
#
# Secrets (see SECURITY.md):
#   CARGO_REGISTRY_TOKEN   crates.io API token (publish-new + publish-update)
on:
  push:
    tags:
      - "v[0-9]+.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.11.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # ----------------------------------------------------------------
  # crates.io upload, then re-package the same tree so github-release
  # can attach a byte-identical `.crate`. Re-cutting a tag whose
  # version is already on crates.io skips the upload.
  # ----------------------------------------------------------------
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: cargo

      - name: The tag and the manifest agree
        run: |
          set -euo pipefail
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ "v${manifest}" != "$TAG" ]; then
            echo "::error::tag ${TAG} but Cargo.toml says ${manifest}; cog's pre-bump hook did not run"
            exit 1
          fi
          echo "::notice::${TAG} matches the package manifest"

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set. See SECURITY.md (CI secrets)."
            exit 1
          fi
          version="${TAG#v}"
          # Re-cutting a GitHub Release for an already-published version
          # must not fail the rest of the pipeline on crates.io's
          # "already uploaded" error. crates.io requires a User-Agent.
          status="$(curl -sS -o /tmp/crate.json -w '%{http_code}' \
            -A 'outbe-poseidon-ci (https://github.com/outbe/outbe-poseidon)' \
            "https://crates.io/api/v1/crates/outbe-poseidon/${version}")"
          case "$status" in
            200)
              echo "::notice::outbe-poseidon@${version} already on crates.io; skipping publish"
              ;;
            404)
              cargo publish --verbose --token "${CARGO_REGISTRY_TOKEN}"
              ;;
            *)
              echo "::error::crates.io lookup failed (HTTP ${status})"
              cat /tmp/crate.json || true
              exit 1
              ;;
          esac

      # Re-create the .crate locally. `cargo publish` cleans up
      # target/package/*.crate after a successful upload; `cargo
      # package --no-verify` is fast (skips the re-build) and
      # deterministic given the same source tree, so the resulting
      # bytes match what crates.io just received (or would receive).
      - name: Re-package .crate for artifact upload
        run: cargo package --no-verify

      - name: Upload .crate as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: crate-tarball
          path: target/package/*.crate
          if-no-files-found: error
          retention-days: 1

  # ----------------------------------------------------------------
  # GitHub release. Attaches the byte-identical `.crate` and a
  # SHA256SUMS file alongside the auto-generated notes. crates.io is
  # the canonical install channel; the GH Release is the signed
  # distribution point.
  # ----------------------------------------------------------------
  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [publish]
    # id-token + attestations so cosign keyless +
    # actions/attest-build-provenance can mint an OIDC token and write
    # to the GitHub attestation store.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Download .crate artifact
        uses: actions/download-artifact@v4
        with:
          name: crate-tarball
          path: dist/

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 *.crate > SHA256SUMS
          echo "---"
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # pin-target: v3

      # Keyless OIDC sign-blob over every staged artifact (.crate +
      # SHA256SUMS). Each gets a sibling `.sig` + `.pem` (the Fulcio-
      # issued ephemeral cert). Skips files that are themselves a sig
      # or cert so a re-run is idempotent.
      - name: Sign release artifacts (cosign keyless)
        run: |
          set -euo pipefail
          cd dist
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in *.sig|*.pem) continue ;; esac
            echo "Signing $f"
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done
          ls -la

      # SLSA v1.0 build provenance for the .crate + SHA256SUMS. Stored
      # in the GitHub attestation store (queryable via `gh attestation
      # verify`).
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # pin-target: v2
        with:
          subject-path: |
            dist/*.crate
            dist/SHA256SUMS

      - name: Compose release body
        env:
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          {
            echo "## Install"
            echo
            echo "    cargo add outbe-poseidon@${TAG#v}"
            echo
            echo "## Artifacts"
            echo
            echo "- \`outbe-poseidon-${TAG#v}.crate\` — byte-identical to the crates.io upload."
            echo "- \`SHA256SUMS\` — SHA-256 of the .crate."
            echo "- \`*.sig\` + \`*.pem\` — sigstore cosign keyless signature + Fulcio cert per artifact."
            echo
            echo "## Verification"
            echo
            echo "See [SECURITY.md](https://github.com/outbe/outbe-poseidon/blob/main/SECURITY.md) for the verify recipe."
            echo
            echo "## CI"
            echo
            echo "- crates.io publish: ${PUBLISH_RESULT}"
          } > RELEASE_BODY.md
          cat RELEASE_BODY.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: RELEASE_BODY.md
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/*.crate
            dist/*.sig
            dist/*.pem
            dist/SHA256SUMS

  # ----------------------------------------------------------------
  # Post-publish smoke test. Re-downloads every asset of the release
  # we just cut and runs `cosign verify-blob` against each one.
  # Hard-fails the workflow on any bad signature — this is the
  # regression test for both the action SHA pins and the cert-
  # identity regex below.
  # ----------------------------------------------------------------
  verify-release:
    name: Verify signed release
    runs-on: ubuntu-latest
    needs: [publish, github-release]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # pin-target: v3

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p verify
          gh release download "$TAG" --dir verify --repo "${{ github.repository }}"
          ls -la verify/

      - name: Verify cosign signatures
        run: |
          set -euo pipefail
          cd verify
          # Identity regex pins the signature to a run of THIS repo's
          # release.yml. Tag-push runs sign as @refs/tags/vX.Y.Z;
          # workflow_dispatch re-releases sign as @refs/heads/main.
          IDENTITY_RE='^https://github\.com/outbe/outbe-poseidon/\.github/workflows/release\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+)$'
          OIDC_ISSUER='https://token.actions.githubusercontent.com'
          failed=0
          shopt -s nullglob
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in *.sig|*.pem) continue ;; esac
            if [ ! -f "${f}.sig" ] || [ ! -f "${f}.pem" ]; then
              echo "::error::missing ${f}.sig or ${f}.pem alongside ${f}"
              failed=1
              continue
            fi
            echo "Verifying $f"
            if cosign verify-blob \
                --certificate "${f}.pem" \
                --signature "${f}.sig" \
                --certificate-identity-regexp "$IDENTITY_RE" \
                --certificate-oidc-issuer "$OIDC_ISSUER" \
                "$f"; then
              echo "  OK $f"
            else
              echo "::error::cosign verify-blob FAILED for $f"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::one or more release artifacts failed signature verification"
            exit 1
          fi
          echo "All artifacts verified."
